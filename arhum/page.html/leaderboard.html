


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - HelpHub AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="d-flex justify-content-between align-items-center  mt-3 mb-5 px-5">
        <div class="d-flex align-items-center gap-2">
            <div class="logo">H</div>
            <strong>HelpHub AI</strong>
        </div>
        <div class="mx-auto nav-links">
                <a href="dashboard.html" class="active">Dashboard</a>
                <a href="onboarding.html">Onboarding</a>
                <a href="leaderboard.html">Profile</a>
            </div>
    </nav>


        <div class="profile-header-card p-5 mb-5 shadow-sm">
            <p class="small text-uppercase tracking-widest opacity-50 mb-1">PROFILE</p>
            <h1 class="display-3 fw-bold text-white mb-2">Arhum Mansoor</h1>
            <p class="text-white opacity-75 mb-0">Both • Karachi</p>
        </div>

        <div class="row g-4">
            <div class="col-lg-7">
                <div class="content-card p-5 h-100">
                    <p class="small fw-bold text-success mb-2 text-uppercase">Public Profile</p>
                    <h2 class="fw-bold mb-4">Skills and reputation</h2>

                    <div class="d-flex justify-content-between border-bottom py-3">
                        <span class="text-muted">Trust score</span>
                        <span class="fw-bold">100%</span>
                    </div>
                    <div class="d-flex justify-content-between border-bottom py-3 mb-4">
                        <span class="text-muted">Contributions</span>
                        <span class="fw-bold">35</span>
                    </div>

                    <p class="small fw-bold mb-2">Skills</p>
                    <div class="d-flex flex-wrap gap-2 mb-4">
                        <span class="tag-pill">Figma</span>
                        <span class="tag-pill">UI/UX</span>
                        <span class="tag-pill">HTML/CSS</span>
                        <span class="tag-pill">Career Guidance</span>
                    </div>

                    <p class="small fw-bold mb-2">Badges</p>
                    <div class="d-flex flex-wrap gap-2">
                        <span class="badge-pill bg-teal-light">Design Ally</span>
                        <span class="badge-pill bg-teal-light">Fast Responder</span>
                        <span class="badge-pill bg-teal-light">Top Mentor</span>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="content-card p-5 h-100">
                    <p class="small fw-bold text-success mb-2 text-uppercase">Edit Profile</p>
                    <h2 class="fw-bold mb-4">Update your identity</h2>

                    <form>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small text-muted mb-1">Name</label>
                                <input type="text" class="form-control custom-input" value="Arhum Mansoor">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-muted mb-1">Location</label>
                                <input type="text" class="form-control custom-input" value="Karachi">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small text-muted mb-1">Skills</label>
                            <input type="text" class="form-control custom-input"
                                value="Figma, UI/UX, HTML/CSS, Career Guidance">
                        </div>

                        <div class="mb-4">
                            <label class="form-label small text-muted mb-1">Interests</label>
                            <input type="text" class="form-control custom-input"
                                value="Hackathons, UI/UX, Community Building">
                        </div>

                        <button type="button" class="btn btn-teal w-100 rounded-pill py-3 fw-bold">Save profile</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <style>
        
        /* Navbar Customization */
        .nav-links a {
            text-decoration: none;
            color: #666;
            margin: 0 15px;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-links a.active {
            color: #000;
            background: #e0ded4;
            padding: 5px 15px;
            border-radius: 20px;
        }

        .navbar strong {
            color: #111827;
            font-weight: 600;
        }

        .logo {
            background: linear-gradient(135deg, #34d399, #10b981);
            color: #ffffff;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        }
        /* Profile Page Custom Styles */
        .bg-light-cream {
            background-color: #f7f6f0;
        }

        .profile-header-card {
            background-color: #24292e;
            /* Dark slate gray */
            border-radius: 40px;
        }

        .content-card {
            background: #fffdf7;
            border-radius: 40px;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .tag-pill {
            background: #eef2f1;
            color: #2d7a6d;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .badge-pill {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .bg-teal-light {
            background: #e6f4f1;
            color: #2d7a6d;
        }

        .custom-input {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
        }

        .custom-input:focus {
            box-shadow: none;
            border-color: #00a896;
        }

        .btn-teal {
            background-color: #00a896;
            color: white;
            border: none;
            transition: 0.3s;
        }

        .btn-teal:hover {
            background-color: #008f80;
            color: white;
        }

        .tracking-widest {
            letter-spacing: 3px;
        }
    </style>

</body>

</html>
